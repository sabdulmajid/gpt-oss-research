experiment_name: gpt_oss_20b_sft_pilot_v1
model:
  name_or_path: ${GPT_OSS_20B_PATH:-openai/gpt-oss-20b}
  teacher_model: ${GPT_OSS_120B_PATH:-openai/gpt-oss-120b}
model_load:
  quantization: mxfp4
  dequantize: true
  attn_implementation: eager
  torch_dtype: bfloat16
  use_cache: false
  device_map: auto
adapter:
  type: lora
  r: 16
  lora_alpha: 32
  lora_dropout: 0.0
  target_modules: all-linear
  expert_targeting:
    enabled: true
    layer_indices: [7, 15, 23]
    parameter_templates:
      - "{layer}.mlp.experts.gate_up_proj"
      - "{layer}.mlp.experts.down_proj"
data:
  manifest_path: data/manifests/sft_starting_mix.manifest.json
  materialized_dataset_path: artifacts/materialized/sft_real_pilot_v1/train.jsonl
output:
  output_dir: artifacts/checkpoints/sft/gpt_oss_20b_sft_pilot_v1
  report_dir: reports/experiments
training:
  output_dir: artifacts/checkpoints/sft/gpt_oss_20b_sft_pilot_v1
  learning_rate: 2.0e-4
  gradient_checkpointing: true
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  max_steps: 20
  logging_steps: 1
  save_steps: 20
  max_length: 3072
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  bf16: true
  report_to: none
