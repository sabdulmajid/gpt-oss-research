experiment_name: gpt_oss_20b_grpo_baseline_v1
model:
  name_or_path: openai/gpt-oss-20b
  teacher_model: /pub7/neel2/hf-cache/gpt-oss-120b
  init_adapter_path: null
model_load:
  note: GRPO starts from gpt-oss-20b; wiring a best-SFT checkpoint is the intended next step after the first honest SFT benchmark.
adapter:
  type: lora
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: all-linear
  expert_targeting:
    enabled: true
    layer_indices: [7, 15, 23]
    parameter_templates:
      - "{layer}.mlp.experts.gate_up_proj"
      - "{layer}.mlp.experts.down_proj"
data:
  manifest_path: data/manifests/grpo_starting_mix.manifest.json
  materialized_dataset_path: data/samples/grpo_smoke_dataset.jsonl
reward:
  type: internal_eval_pass
  tasks_root: eval/ml_research_eval/tasks
output:
  output_dir: artifacts/checkpoints/grpo/gpt_oss_20b_grpo_baseline_v1
  report_dir: reports/experiments
training:
  output_dir: artifacts/checkpoints/grpo/gpt_oss_20b_grpo_baseline_v1
  learning_rate: 1.0e-6
  gradient_checkpointing: true
  num_train_epochs: 1
  logging_steps: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  num_generations: 4
  max_prompt_length: 2048
  max_completion_length: 768
  beta: 0.0
  bf16: true
  use_vllm: false
  report_to: none

